<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Finanzas Personales</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--pri:#2563eb;--line:#e5e7eb}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:18px;background:#111827;color:white;position:sticky;top:0;z-index:4}header h1{font-size:21px;margin:0}.tabs{display:flex;overflow:auto;background:#111827;padding:0 10px 12px;position:sticky;top:57px;z-index:3}.tabs button{-webkit-appearance:none;touch-action:manipulation;cursor:pointer;border:0;background:transparent;color:#cbd5e1;padding:10px 12px;white-space:nowrap;font-weight:700}.tabs button.active{background:#273449;color:white;border-radius:10px}main{padding:14px;max-width:1000px;margin:auto}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 8px 22px rgba(15,23,42,.06)}.value{font-size:24px;font-weight:800}.muted{color:var(--muted);font-size:12px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:12px;color:var(--muted)}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #d8deea;border-radius:9px;background:var(--card);color:var(--ink)}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--pri);color:white;font-weight:800}.secondary{background:#e8efff;color:#1d4ed8}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}.num{text-align:right}.progress{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--pri)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px}.dark{--bg:#07111f;--card:#111c2f;--ink:#eef4ff;--muted:#9cacbf;--line:#26354c}.dark input,.dark select{border-color:#34445e}.switch{position:absolute;right:15px;top:15px}.project{border-left:4px solid #0f9f8f}.bar{height:12px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#0f9f8f}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.form{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>Finanzas Personales</h1><button id="theme" class="btn secondary switch">◐</button></header><nav class="tabs"><button type="button" class="active" data-page="home">Resumen</button><button type="button" data-page="moves">Movimientos</button><button type="button" data-page="debts">Deudas</button><button type="button" data-page="projects">Proyectos</button><button type="button" data-page="settings">Datos</button></nav><main>
<section id="home" class="page active"><div class="grid"><div class="card"><div class="muted">Salario</div><div id="kSalary" class="value"></div></div><div class="card"><div class="muted">Gastos fijos</div><div id="kFixed" class="value"></div></div><div class="card"><div class="muted">Deudas</div><div id="kDebt" class="value"></div></div><div class="card"><div class="muted">Disponible</div><div id="kFree" class="value"></div></div></div><div class="card"><h3>Deudas actuales</h3><div id="homeDebts"></div></div></section>
<section id="moves" class="page"><div class="card"><h3>Nuevo movimiento</h3><div class="form"><div><label>Fecha</label><input id="mDate" type="date"></div><div><label>Tipo</label><select id="mType"><option>Gasto</option><option>Ingreso</option><option>Pago de deuda</option><option>Ahorro</option></select></div><div><label>Concepto</label><input id="mConcept"></div><div><label>Categoría</label><input id="mCategory"></div><div><label>Valor</label><input id="mAmount" type="number" inputmode="numeric"></div><div><label>Deuda</label><select id="mDebt"><option value="">Ninguna</option><option>BRAVO</option><option>LULO BANK</option><option>TC LULO</option><option>iPad</option></select></div></div><div class="actions"><button id="addMove" class="btn">Guardar</button></div></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th class="num">Valor</th></tr></thead><tbody id="moveRows"></tbody></table></div></div></section>
<section id="debts" class="page"><div class="card"><h3>Deudas</h3><div id="debtCards"></div></div></section>
<section id="projects" class="page"><div class="card"><h3>Nueva meta</h3><div class="form"><div><label>Proyecto</label><input id="pName"></div><div><label>Meta</label><input id="pTarget" type="number"></div><div><label>Ahorrado</label><input id="pSaved" type="number" value="0"></div><div><label>Fecha objetivo</label><input id="pDate" type="date"></div></div><div class="actions"><button id="addProject" class="btn">Crear</button></div></div><div id="projectCards"></div></section>
<section id="settings" class="page"><div class="card"><h3>Datos principales</h3><div class="form"><div><label>Salario</label><input id="salary" type="number"></div><div><label>Gastos fijos</label><input id="fixed" type="number"></div></div><div class="actions"><button id="saveSettings" class="btn">Guardar</button><button id="backup" class="btn secondary">Exportar copia</button></div></div></section>
</main><button class="fab" id="quick">+</button><script>
'use strict';const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(+n||0),today=()=>new Date().toISOString().slice(0,10);const defaults={salary:2758590,fixed:848800,moves:[],projects:[],debts:[{name:'BRAVO',balance:1400000,payment:202000},{name:'LULO BANK',balance:750000,payment:50000},{name:'TC LULO',balance:1350000,payment:350000},{name:'iPad',balance:2000000,payment:400000}]};let d;try{d=JSON.parse(localStorage.getItem('nativeFinance'))}catch(e){}d=d||defaults;function save(){localStorage.setItem('nativeFinance',JSON.stringify(d))}function render(){let debt=d.debts.reduce((s,x)=>s+x.balance,0),pay=d.debts.reduce((s,x)=>s+x.payment,0);$('kSalary').textContent=money(d.salary);$('kFixed').textContent=money(d.fixed);$('kDebt').textContent=money(debt);$('kFree').textContent=money(d.salary-d.fixed-pay);$('homeDebts').innerHTML=d.debts.map(x=>`<p><strong>${x.name}</strong> ${money(x.balance)}</p><div class="progress"><span style="width:${debt?x.balance/debt*100:0}%"></span></div>`).join('');$('debtCards').innerHTML=d.debts.map(x=>`<div class="card"><strong>${x.name}</strong><p>Saldo: ${money(x.balance)} · Cuota: ${money(x.payment)}</p></div>`).join('');$('moveRows').innerHTML=[...d.moves].reverse().map(x=>`<tr><td>${x.date}</td><td>${x.concept}</td><td>${x.type}</td><td class="num">${money(x.amount)}</td></tr>`).join('');$('projectCards').innerHTML=d.projects.map((p,i)=>{let progress=Math.min(100,p.saved/p.target*100),months=Math.max(1,Math.ceil((new Date(p.date)-new Date())/2629800000)),need=(p.target-p.saved)/months;return `<div class="card project"><strong>${p.name}</strong><p>${money(p.saved)} de ${money(p.target)}</p><div class="bar"><span style="width:${progress}%"></span></div><p class="muted">Necesitas ${money(need)} al mes · ${p.date}</p><button class="btn secondary" data-contribute="${i}">Aportar</button></div>`}).join('');$('salary').value=d.salary;$('fixed').value=d.fixed}function openPage(pageId){
  var buttons=document.querySelectorAll('.tabs button');
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<buttons.length;i++){buttons[i].classList.remove('active');}
  for(var j=0;j<pages.length;j++){pages[j].classList.remove('active');}
  var activeButton=document.querySelector('.tabs button[data-page="'+pageId+'"]');
  var activePage=document.getElementById(pageId);
  if(activeButton){activeButton.classList.add('active');}
  if(activePage){activePage.classList.add('active');}
  try{history.replaceState(null,'','#'+pageId);}catch(error){}
  window.scrollTo(0,0);
}
var tabButtons=document.querySelectorAll('.tabs button');
for(var tabIndex=0;tabIndex<tabButtons.length;tabIndex++){
  (function(button){
    button.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      openPage(button.getAttribute('data-page'));
    },false);
  })(tabButtons[tabIndex]);
}
window.addEventListener('hashchange',function(){
  var target=location.hash.replace('#','');
  if(target&&document.getElementById(target)){openPage(target);}
});$('mDate').value=today();$('addMove').addEventListener('click',()=>{let amount=+$('mAmount').value,concept=$('mConcept').value.trim(),type=$('mType').value,debt=$('mDebt').value;if(!concept||amount<=0)return alert('Completa concepto y valor');d.moves.push({date:$('mDate').value,type,concept,category:$('mCategory').value,amount,debt});if(type==='Pago de deuda'&&debt){let x=d.debts.find(z=>z.name===debt);if(x)x.balance=Math.max(0,x.balance-amount)}save();render();$('mConcept').value=$('mAmount').value=''});$('addProject').addEventListener('click',()=>{let name=$('pName').value.trim(),target=+$('pTarget').value,date=$('pDate').value;if(!name||!target||!date)return alert('Completa nombre, meta y fecha');d.projects.push({name,target,saved:+$('pSaved').value||0,date});save();render()});$('projectCards').addEventListener('click',e=>{let i=e.target.dataset.contribute;if(i!==undefined){let v=+prompt('Valor del aporte');if(v>0){d.projects[i].saved=Math.min(d.projects[i].target,d.projects[i].saved+v);d.moves.push({date:today(),type:'Ahorro',concept:'Proyecto '+d.projects[i].name,category:'Ahorro',amount:v});save();render()}}});$('saveSettings').addEventListener('click',()=>{d.salary=+$('salary').value;d.fixed=+$('fixed').value;save();render();alert('Guardado')});$('backup').addEventListener('click',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='finanzas.json';a.click()});$('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))});$('quick').addEventListener('click',()=>document.querySelector('[data-page="moves"]').click());if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');render();var initialPage=location.hash.replace('#','');openPage(document.getElementById(initialPage)?initialPage:'home');
</script></body></html>
